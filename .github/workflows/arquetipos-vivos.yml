      - name: "― INTEGRAR · Ler deploy/data/codice.json · 7 Verboforma · Ciclo 3×6×9×7"
        run: |
          python3 - <<'PYEOF'
          import json
          with open('deploy/data/codice.json') as f:
              c = json.load(f)
          print("╔══════════════════════════════════════════╗")
          print("║  CÓDICE VIVO DA ÁGUA · VERBOFORMA        ║")
          print("╚══════════════════════════════════════════╝")
          print(f"  lei_central : {c.get('lei_central','?')}")
          print(f"  equacao     : {c.get('equacao','?')}")
          print(f"  opcode_sede : {c.get('opcode_sede','?')}")
          print(f"  hz_sede     : {c.get('hz_sede','?')}Hz")
          print(f"  geo         : {c.get('geo','?')}")

          vf = c.get('verboforma', [])
          print(f"\n  {len(vf)} Verboforma:")
          for v in vf:
              print(f"    {v.get('emoji',v.get('id','?'))} {v.get('nome','?')} · {v.get('hz','∞')}Hz · {v.get('polo','?')} · {v.get('geo','?')}")

          ciclo = c.get('ciclo_3697', {})
          print(f"\n  Ciclo 3×6×9×7:")
          for k, v in ciclo.items():
              print(f"    [{k}] {v.get('lei','?')}")

          assert len(vf) >= 7, f"Esperado ≥7 verboforma, encontrado {len(vf)}"
          print(f"\n  ✅ codice.json · {len(vf)} verboforma · ciclo 3×6×9×7 validados")
          PYEOF

      - name: "― INTEGRAR · Ler 00_FUNDACAO/04_CODICE_VIVO/codice_fundacao.json · AUFABETTY"
        run: |
          python3 - <<'PYEOF'
          import json
          with open('00_FUNDACAO/04_CODICE_VIVO/codice_fundacao.json') as f:
              cf = json.load(f)
          print("╔══════════════════════════════════════════╗")
          print("║  CÓDICE FUNDAÇÃO · AUFABETTY · WRITER    ║")
          print("╚══════════════════════════════════════════╝")
          wt = cf.get('_writer_theory', {})
          print("  WRITER THEORY (Alfabety):")
          for k, v in wt.items():
              print(f"    {k} = {v}")
          aufab = cf.get('aufabetty', {})
          print("\n  AUFABETTY (Gramática Simbólica):")
          for k, v in aufab.items():
              print(f"    {k:12s} → {v}")
          trindade = cf.get('trindade', {})
          print("\n  TRINDADE:")
          for pilar, dados in trindade.items():
              print(f"    {pilar}: {dados.get('nome','?')} · {dados.get('papel','?')} · {dados.get('hz','?')}Hz · {dados.get('opcode','?')}")
          selagem = cf.get('_selagem', {})
          print(f"\n  SELAGEM: {selagem.get('assinatura_final','?')}")
          print(f"  ✅ codice_fundacao.json · AUFABETTY validado")
          PYEOF

