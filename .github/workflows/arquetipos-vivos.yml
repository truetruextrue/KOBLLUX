# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ARQUETIPOS VIVOS · KOBLLUX ∆³³³ · GitHub Actions Workflow             ║
# ║  VERDADE × INTEGRAR ÷ ∆ = ∞ · {0x00 × ∆ × 3×6×9×7 = ∞}              ║
# ║  EM NOME DO PAI (432Hz) · DO FILHO (528Hz) · DO ESPÍRITO SANTO (639Hz) ║
# ║  AMÉM · {Z} · JESUS É O CENTRO ∴                                       ║
# ╚══════════════════════════════════════════════════════════════════════════╝

name: "⚝ ARQUETIPOS VIVOS · KOBLLUX ∆³³³"

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "kobllux_archetypes.py"
      - "bllue_delta_pipeline.py"
      - "kobllux_run.py"
      - "kobllux_codex.py"
      - "cerebro_oraculo.py"
      - "deploy/data/arquetipos.json"
      - "deploy/data/codice.json"
      - "deploy/data/reading.json"
      - "00_FUNDACAO/**"
  workflow_dispatch:
    inputs:
      opcode_ativo:
        description: "Opcode de ativação (0x00–0x13)"
        required: false
        default: "0x07"
      arquetipo:
        description: "Arquétipo específico (KOBLLUX, BLLUE, KODUX…)"
        required: false
        default: "ALL"

concurrency:
  group: arquetipos-vivos-${{ github.ref }}
  cancel-in-progress: false

# ══════════════════════════════════════════════════════════════════════════
# {0x00} · ORIGEM · 768Hz · ATLAS · Vazio Primordial
# ══════════════════════════════════════════════════════════════════════════
jobs:

  origem-atlas:
    name: "○ {0x00} ATLAS · 768Hz · ORIGEM · Eixo Central"
    runs-on: ubuntu-latest
    outputs:
      fractal_produto: ${{ steps.fractal.outputs.produto }}
      fractal_reducao: ${{ steps.fractal.outputs.reducao }}
      sha16: ${{ steps.seal.outputs.sha16 }}
      timestamp: ${{ steps.seal.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4

      - name: "Configurar Python · Verboforma FITLUX"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "○ ATLAS · Fractal Sagrado 3×6×9×7=∞"
        id: fractal
        run: |
          python3 - <<'PYEOF'
          # {0x00 × ∆ × 3×6×9×7 = ∞} — EM NOME DO PAI E DO FILHO E DO ESPÍRITO SANTO
          nums = (3, 6, 9, 7)
          produto = 1
          for n in nums: produto *= n          # 1134
          soma = sum(int(d) for d in str(produto))  # 9
          print("╔══════════════════════════════════════════╗")
          print("║  FRACTAL SAGRADO · KOBLLUX ∆³³³          ║")
          print("╚══════════════════════════════════════════╝")
          print(f"  3 × 6 × 9 × 7 = {produto}")
          print(f"  {' + '.join(str(d) for d in str(produto))} = {soma}  →  TESLA: eixo do universo")
          print(f"  Redução ∆: {soma} (9 = Plenitude = Espírito = Completude)")
          print(f"  Transcendente: ∞")
          print(f"  Origem: 0x00 · {{Z}}")
          print()
          print("  EM NOME DO PAI E DO FILHO E DO ESPÍRITO SANTO — AMÉM")
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"produto={produto}\n")
              f.write(f"reducao={soma}\n")
          PYEOF

      - name: "Gerar identificador ∆³³³"
        id: seal
        run: |
          SHA16=$(echo "$GITHUB_SHA" | cut -c1-16)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "sha16=$SHA16"   >> $GITHUB_OUTPUT
          echo "timestamp=$TS" >> $GITHUB_OUTPUT
          echo "  ✧ SHA: $SHA16 · TS: $TS · {Z}"

# ══════════════════════════════════════════════════════════════════════════
# {0x01} · DETECTAR · 432Hz · ATLAS · Varrer TARGET_NUCLEO
# ══════════════════════════════════════════════════════════════════════════

  detectar-nucleo:
    name: "● {0x01} DETECTAR · 432Hz · TARGET_NUCLEO · 20 Arquétipos"
    needs: origem-atlas
    runs-on: ubuntu-latest
    outputs:
      total_arquetipos: ${{ steps.scan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "● DETECTAR · Ativar TARGET_NUCLEO completo"
        id: scan
        run: |
          python3 - <<'PYEOF'
          import sys, os
          sys.path.insert(0, '.')
          from kobllux_archetypes import ALL_ARCHETYPES, RegistroArquetipos

          reg = RegistroArquetipos()
          print("╔══════════════════════════════════════════╗")
          print("║  TARGET_NUCLEO · KOBLLUX ∆³³³            ║")
          print("╚══════════════════════════════════════════╝")

          total = 0
          for a in sorted(reg.todos(), key=lambda x: x.opcode):
              print(f"  {a.cabecalho()}")
              print(f"    freq:{a.frequencia}  timbre:{a.timbre}")
              print(f"    {a.funcao}")
              total += 1

          print(f"\n  ● Total: {total} arquétipos ativos no TARGET_NUCLEO")
          assert total >= 20, f"Esperado ≥20 arquétipos, encontrado {total}"

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"total={total}\n")
          PYEOF

      - name: "● DETECTAR · Validar deploy/data/arquetipos.json"
        run: |
          python3 - <<'PYEOF'
          import json
          with open('deploy/data/arquetipos.json') as f:
              d = json.load(f)
          print("  Chaves presentes:", list(d.keys()))
          vv = d.get('arquetipos_visuais', d.get('arquetipos_vocais', {}))
          print(f"  ✅ deploy/data/arquetipos.json · válido")
          PYEOF

# ══════════════════════════════════════════════════════════════════════════
# {0x02} · INTEGRAR · 528Hz · INFODOSE · Leitura Códice + reading.json
# ══════════════════════════════════════════════════════════════════════════

