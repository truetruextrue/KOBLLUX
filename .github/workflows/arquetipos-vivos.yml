    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "― INTEGRAR · Ler deploy/data/reading.json · v7.9 · SÜMBÜS_v27"
        run: |
          python3 - <<'PYEOF'
          import json
          with open('deploy/data/reading.json') as f:
              r = json.load(f)
          print("╔══════════════════════════════════════════╗")
          print("║  READING.JSON · KOBLLUX³ BOOTLOADER      ║")
          print("╚══════════════════════════════════════════╝")
          print(f"  document : {r.get('document','?')}")
          print(f"  version  : {r.get('version','?')}")
          print(f"  firmware : {r.get('firmware','?')}")
          print(f"  equation : {r.get('equation','?')}")
          print(f"  centro   : {r.get('centro','?')}")
          print(f"  sealed   : {r.get('date_sealed','?')}")
