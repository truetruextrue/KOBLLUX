# ╔══════════════════════════════════════════════════════════════════════╗
# ║  KOBLLUX³ · GitHub Pages Deploy · VERDADE × INTEGRAR ÷ ∆ = ∞      ║
# ║  Publica deploy/ como site estático · v7.9 · 13 opcodes            ║
# ║  META LUX · conexão CLAUDE removida · domínio www selado · ∆⅞      ║
# ║  Espelho reverso: 0x07 SELAR → 0x09 EXPANDIR → 0x06 INTEGRAR →     ║
# ║                    0x03 DETECTAR (o caminho que leva também volta) ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: "✧ KOBLLUX · GitHub Pages"

on:
  push:
    branches:
      - main
      # ✧ META LUX · REMOVIDO: "claude/adoring-cerf-zo03e" (conexão Claude
      #   retirada — só main dispara o deploy. As branches claude/* podem
      #   ser deletadas do repo: git push origin --delete <branch>.)
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar deploy (mesmo sem mudanças)"
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────
# ○ 0×00 ORIGEM · Build
# ─────────────────────────────────────────────────────────────────────
jobs:

  build:
    name: "○ 0×00 ORIGEM · Build Deploy Artifact"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout KOBLLUX"
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: "● KODUX · Verificar estrutura obrigatória"
        run: |
          echo "● KODUX DETECTAR — verificando malha deploy/ antes do build"
          ERRORS=0
          check() {
            if [ -e "$1" ]; then
              echo "  ✅ $1"
            else
              echo "  ❌ AUSENTE: $1"
              ERRORS=$((ERRORS+1))
            fi
          }
          echo "─── Raiz deploy/ ───"
          check "deploy/index.html"
          check "deploy/manifest.json"
          check "deploy/sumbüs-fusion.html"
          # ✧ META LUX · quando robots.txt e sitemap.xml estiverem em deploy/,
          #   descomente as duas linhas abaixo para virarem obrigatórios:
          # check "deploy/robots.txt"
          # check "deploy/sitemap.xml"
          echo ""
          echo "─── Dados ───"
          check "deploy/data/codice.json"
          check "deploy/data/opcodes.json"
          check "deploy/data/arquetipos.json"
          check "deploy/data/frequencias.json"
          echo ""
          echo "─── CSS 13 Opcodes ───"
          for op in 0x00-origem 0x01-detectar 0x02-integrar 0x03-expandir 0x04-lapidar \
                    0x05-convergir 0x06-unificar 0x07-selar 0x08-testemunhar 0x09-eternizar \
                    0x0A-tutorial 0x0B-arquetipo 0x0C-sintese; do
            check "deploy/web/css/${op}.css"
          done
          echo ""
          echo "─── JS 13 Opcodes ───"
          for op in 0x00-origem 0x01-detectar 0x02-integrar 0x03-expandir 0x04-lapidar \
                    0x05-convergir 0x06-unificar 0x07-selar 0x08-testemunhar 0x09-eternizar \
                    0x0A-tutorial 0x0B-arquetipo 0x0C-sintese; do
            check "deploy/web/js/opcodes/${op}.js"
          done
          echo ""
          TOTAL=$(find deploy/ -type f | wc -l)
          echo "● KODUX · $TOTAL arquivos em deploy/ · $ERRORS erros"
          [ $ERRORS -eq 0 ] || exit 1

      - name: "✧ SELAR · Injetar metadados no codice.json"
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA16=$(echo "$GITHUB_SHA" | cut -c1-16)
          echo "  ✧ SELAR · timestamp: $TS · sha: $SHA16"
          python3 -c "
          import json
          with open('deploy/data/codice.json') as f:
              d = json.load(f)
          d['deploy'] = {
              'timestamp': '$TS',
              'sha': '$SHA16',
              'branch': '${{ github.ref_name }}',
              'actor': '${{ github.actor }}',
              'run': '${{ github.run_number }}',
              # ✧ META LUX · domínio acoplado (era github.io → agora www.kobllux.com.br)
              'url': 'https://www.kobllux.com.br/',
              # ✧ META LUX · e-mail acoplado (troque pelo seu real)
              'contato': 'contato@kobllux.com.br'
          }
          with open('deploy/data/codice.json', 'w') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
          print('  ✅ deploy metadata injetada em codice.json · domínio www selado')
          "

      - name: "Setup Pages"
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d

      - name: "Upload artifact · deploy/"
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: "deploy"

# ─────────────────────────────────────────────────────────────────────
# ▢ 0×03 EXPANDIR · Deploy
# ─────────────────────────────────────────────────────────────────────
  deploy:
    name: "▢ 0×03 EXPANDIR · Deploy GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: "✧ SELAR · URL publicada"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  ✧ KOBLLUX³ PUBLICADO · 0x07 SELAR · 777Hz             ║"
          echo "║                                                          ║"
          echo "║  Fusion Card : https://www.kobllux.com.br/index.html   ║"
          echo "║  SÜMBÜS IDE  : https://www.kobllux.com.br/sumbüs-fusion.html"
          echo "║  Códice JSON : https://www.kobllux.com.br/data/codice.json"
          echo "║                                                          ║"
          echo "║  VERDADE × INTEGRAR ÷ Δ = ∞  ·  3×6×9×7 = 1134        ║"
          echo "║  JESUS É O CENTRO ∴                                     ║"
          echo "╚══════════════════════════════════════════════════════════╝"

      - name: "Summary GitHub Actions"
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## ✧ KOBLLUX³ · GitHub Pages · VERDADE × INTEGRAR ÷ ∆ = ∞

          | Página | URL |
          |--------|-----|
          | **Fusion Card** | https://www.kobllux.com.br/ |
          | **SÜMBÜS IDE** | https://www.kobllux.com.br/sumbüs-fusion.html |
          | **Códice Vivo** | https://www.kobllux.com.br/data/codice.json |
          | **Opcodes** | https://www.kobllux.com.br/data/opcodes.json |

          ### Sistema
          - **VERDADE × INTEGRAR ÷ Δ = ∞**
          - **Equação:** `3 × 6 × 9 × 7 = 1134`
          - **Opcodes:** 13 (0x00 → 0x0C)
          - **Verboforma:** FIT LUX · KODUX · BLLUE · HÓRUS · METALUX · INFODOSE · KOBLLUX
          - **sealCodice:** ✅ integrado · 0x07 SELAR · 777Hz
          - **META LUX:** conexão Claude removida · domínio www.kobllux.com.br selado

          ### Espelho reverso (o caminho que leva também volta)
          0x07 SELAR → 0x09 EXPANDIR → 0x06 INTEGRAR → 0x03 DETECTAR · ∆⅞

          > EM NOME DO PAI (UNO · 432Hz), DO FILHO (DUAL · 528Hz) E DO ESPÍRITO SANTO (TRINITY · 639Hz). AMÉM. ∆7
          SUMMARY
